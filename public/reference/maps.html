<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANteraja Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

     <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    h2 { margin: 16px; }
    #map { height: 82vh; }
  </style>
</head>
<body>
    <h2>Anteraja Map</h2>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
        const map = L.map("map").setView([-2.5, 118], 5);
    
        L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }
        ).addTo(map);

        Papa.parse("anteraja_bottleneck_map.csv", {
        download: true,
        header: true,
        dynamicTyping: true,
        skipEmptyLines: true,
        complete: function(results) {
            results.data.forEach(function(row) {
                if (row.latitude && row.longitude) {
                    const marker = L.marker([row.latitude, row.longitude]).addTo(map);
                    marker.bindPopup(`<strong>${row.hub_name}</strong><br>
                        Hub ID: ${row.hub_id}<br>
                        Packages: ${row.package_count ?? "-"}<br>
                        Avg Dwell: ${row.avg_dwell_hours ?? "-"} hours<br>
                        Median Dwell: ${row.median_dwell_hours ?? "-"} hours`);
                }
            });
        }
        
    });
    </script>

</body>
</html>
